# League strength multipliers — operator-tuned reference table.
#
# Reference league: Premier League (multiplier = 1.0). Other leagues scaled
# relative to it. Used by player_recent_form to normalize per-90 rates
# across heterogeneous club leagues before blending into match predictions.
#
# Confidence levels:
#   high   -- operator has direct experience watching the league
#   medium -- inferred from public data (Club Elo, UEFA coefficient)
#   low    -- coarse guess; flag for review post-Mundial-2026 backtest
#
# Adding a league: pick its API-Football league_id from /leagues, choose a
# multiplier (0.1-1.5), set confidence honestly, and re-run tests to verify
# the schema still validates.
#
# **PLACEHOLDER VALUES** — operator MUST review before Phase 4 backtest.
# Seeded from public Club Elo league averages (2025) as initial estimates.

