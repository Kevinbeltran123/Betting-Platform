[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "betting-intelligence-platform"
version = "0.1.0"
description = "Multi-sport betting intelligence platform"
requires-python = ">=3.12"
dependencies = [
    "pydantic==2.13.3",
    "pydantic-settings==2.14.0",
    "supabase==2.28.3",
    "psycopg[binary]>=3.3.3",
    "httpx==0.28.1",
    "tenacity==9.1.4",
    "APScheduler>=3.11,<4.0",
    "polars==1.40.1",
    "pyarrow==24.0.0",
    "structlog==25.5.0",
    "pyyaml>=6.0.3",
    "xgboost==3.2.0",
    "catboost==1.2.10",
    "lightgbm==4.6.0",
    "scikit-learn==1.8.0",
    "penaltyblog==1.9.0",
    "anthropic>=0.50",
    "python-telegram-bot[rate-limiter]==22.7",
    "sdnotify==0.3.2",
    "jinja2>=3.1",
    "typer==0.24.2",
    "joblib>=1.4.0",
    "numpy>=2.2,<3",
    "scipy>=1.15,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-httpx>=0.35.0",
    "ruff>=0.15.11",
    "mypy>=1.15.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bip"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["slow: mark test as slow (skipped in CI fast-lane)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
