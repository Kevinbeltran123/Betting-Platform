[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "betting-intelligence-platform"
version = "0.1.0"
description = "Multi-sport betting intelligence platform"
requires-python = ">=3.12"
dependencies = [
    "pydantic==2.13.3",
    "pydantic-settings==2.14.0",
    "supabase==2.28.3",
    "psycopg[binary]>=3.3.3",
    "httpx==0.28.1",
    "tenacity==9.1.4",
    "APScheduler>=3.11,<4.0",
    "polars==1.40.1",
    "pyarrow==24.0.0",
    "structlog==25.5.0",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-httpx>=0.35.0",
    "ruff>=0.15.11",
    "mypy>=1.15.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bip"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
