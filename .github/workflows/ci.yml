name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Test
        # tests/evaluation and tests/spike read research datasets that are not
        # committed to the repo; they only run locally.
        run: uv run pytest -m "not slow" --ignore=tests/evaluation --ignore=tests/spike
